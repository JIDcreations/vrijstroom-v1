.anim .hero-ster path { animation: uitwaaier 1.5s cubic-bezier(.65, 0, .25, 1) both; animation-delay: calc(.25s + var(--k) * .09s); }

.anim .hero-ster .draai { animation: traag 90s linear 2.4s infinite; }
